behaviors:
  CarDriverAgent:
    trainer_type: ppo
    hyperparameters:
      batch_size: 4096       # Doubled to handle more data
      buffer_size: 81920      # Enough for ~1.5 full cycles of all 16 agents
      learning_rate: 0.0002
      learning_rate_schedule: linear
      beta: 0.002            # Lowered slightly to "stabilize" the driving
      beta_schedule: linear
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256       # More capacity for complex turns
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.995         # Increased slightly to value future rewards (laps) more
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.005      # Halved curiosity since they already know the basics
        learning_rate: 0.0001
    max_steps: 25000000
    time_horizon: 1024       # Better "memory" of the lap progress
    summary_freq: 20000
    checkpoint_interval: 1000000
