behaviors:

  # ────────────────────────────────────────────────────────────
  # ALPHA: The Aggressive Racer
  # Strategy: High speed bonus, low crash penalties.
  #           Will barge through traffic and accept wall scrapes
  #           in exchange for maximum lap speed.
  #           Curiosity enabled to keep exploring fast lines.
  # ────────────────────────────────────────────────────────────
  CarDriverAgent_Alpha:
    trainer_type: ppo
    hyperparameters:
      batch_size: 2048
      buffer_size: 40960
      learning_rate: 0.0003          # Slightly higher LR — learns fast, adapts fast
      learning_rate_schedule: linear
      beta: 0.005                    # Higher entropy — Alpha explores more aggressively
      beta_schedule: linear
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.99                  # Standard: values immediate speed gains
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.01               # Higher curiosity: Alpha will try new, risky lines
        learning_rate: 0.0003
    max_steps: 25000000
    time_horizon: 512                # Shorter horizon: focused on NOW (speed-first thinking)
    summary_freq: 20000
    checkpoint_interval: 1000000

  # ────────────────────────────────────────────────────────────
  # BETA: The Calculated Driver
  # Strategy: Heavy collision/wall penalties, large checkpoint
  #           rewards. Will find a slower but cleaner racing line
  #           that avoids all contact. Long-term thinker.
  # ────────────────────────────────────────────────────────────
  CarDriverAgent_Beta:
    trainer_type: ppo
    hyperparameters:
      batch_size: 4096
      buffer_size: 81920
      learning_rate: 0.0002          # Lower LR — learns slower but more stably
      learning_rate_schedule: linear
      beta: 0.002                    # Lower entropy — Beta exploits safe lines once found
      beta_schedule: linear
      epsilon: 0.2
      lambd: 0.98                    # Higher lambda — more credit assigned to past actions
      num_epoch: 4                   # More epochs — really extracts value from each sample
    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
    reward_signals:
      extrinsic:
        gamma: 0.995                 # Higher gamma: values lap completion (distant reward) more
        strength: 1.0
      curiosity:
        gamma: 0.99
        strength: 0.002              # Low curiosity: Beta trusts its known safe path
        learning_rate: 0.0001
    max_steps: 25000000
    time_horizon: 1024               # Longer horizon: plans further ahead
    summary_freq: 20000
    checkpoint_interval: 1000000
